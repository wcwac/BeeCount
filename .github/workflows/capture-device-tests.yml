name: Reference device tests (manual)
on:
  workflow_call:
    inputs:
      run_device_tests:
        type: boolean
        required: true
      source_run:
        type: string
        required: true
  workflow_dispatch:
    inputs:
      run_device_tests:
        description: "已授权：仅在临时云模拟器执行本项目测试 APK"
        type: boolean
        default: false
        required: true
      source_run:
        description: "同一 Android 源码树、已成功完成的手动构建 run ID"
        type: string
        required: true
permissions:
  contents: read
  actions: read
concurrency:
  group: reference-device-${{ github.ref }}
  cancel-in-progress: false
jobs:
  device:
    if: inputs.run_device_tests == true
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      CAPTURE_DEVICE_TESTS_OPT_IN: ${{ inputs.run_device_tests }}
      CAPTURE_SYSTEM_IMAGE: "system-images;android-36;default;x86_64"
      CAPTURE_IMAGE_REVISION: "2"
      CAPTURE_EMULATOR_REVISION: "37.2.12"
      CAPTURE_PLATFORM_TOOLS_REVISION: "37.0.1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Verify completed source build and identical app inputs
        id: source
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          SOURCE_RUN: ${{ inputs.source_run }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$GITHUB_REF" == refs/heads/feat/yimu-reference-rebuild ]]
          [[ "$SOURCE_RUN" =~ ^[0-9]+$ ]]
          gh api "repos/$GH_REPO/actions/runs/$SOURCE_RUN" > "$RUNNER_TEMP/source-run.json"
          python3 - <<'PY'
          import json,os
          run=json.load(open(os.environ['RUNNER_TEMP']+'/source-run.json'))
          source=run['head_sha'];current=os.environ['GITHUB_SHA']
          if source!=current:
              import subprocess
              repository=os.environ['GH_REPO']
              def api(path):return json.loads(subprocess.check_output(['gh','api','repos/'+repository+'/'+path],text=True))
              def android_tree(commit):return next(e['sha'] for e in api('git/trees/'+commit)['tree'] if e['path']=='android')
              assert android_tree(source)==android_tree(current), 'APK Android sources differ from current branch'
              path='contents/.github/scripts/prepare_reference_resources.py?ref='
              assert api(path+source)['sha']==api(path+current)['sha'], 'Resource preparation source differs'
              print('App inputs match; only build/test driver metadata may differ from the source run')
          assert run['head_branch']=='feat/yimu-reference-rebuild'
          assert run['conclusion']=='success' and run['status']=='completed'
          assert run['path']=='.github/workflows/release.yml'
          with open(os.environ['GITHUB_OUTPUT'],'a') as out:out.write('number='+str(run['run_number'])+'\n')
          PY
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          github-token: ${{ github.token }}
          run-id: ${{ inputs.source_run }}
          name: reference-device-test-apks-${{ steps.source.outputs.number }}
          path: cloud-apks
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad
        with:
          distribution: temurin
          java-version: "17"
      - name: Prepare official emulator on the cloud runner
        shell: bash
        run: |
          set -euo pipefail
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platform-tools" "emulator" "$CAPTURE_SYSTEM_IMAGE"
          sudo sh -c 'echo KERNEL==\"kvm\",GROUP=\"kvm\",MODE=\"0666\",OPTIONS+=\"static_node=kvm\" > /etc/udev/rules.d/99-kvm4all.rules'
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Execute compiled project tests without rebuilding
        run: bash .github/scripts/run_capture_device_tests.sh
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: reference-device-results-${{ github.run_number }}
          path: ${{ runner.temp }}/capture-device/
          if-no-files-found: warn
          retention-days: 14
