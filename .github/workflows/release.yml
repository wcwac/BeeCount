name: Yimu reference Android (manual)

on:
  workflow_dispatch:
    inputs:
      version:
        description: "实验版版本号"
        type: string
        default: "0.1.0"
        required: true
      sign_apk:
        description: "使用仓库固定密钥签名"
        type: boolean
        default: true
      create_release:
        description: "全部检查通过后发布实验预发行版"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: yimu-reference-${{ github.ref }}
  cancel-in-progress: false

jobs:
  android:
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    outputs:
      tag: ${{ steps.metadata.outputs.tag }}
    env:
      BUILD_VERSION: ${{ inputs.version }}
      BUILD_NUMBER: ${{ github.run_number }}
      SIGN_APK: ${{ inputs.sign_apk }}
      CREATE_RELEASE: ${{ inputs.create_release }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Validate scope and source boundaries
        id: metadata
        shell: bash
        run: |
          set -euo pipefail
          [[ "$GITHUB_REF" == refs/heads/feat/yimu-reference-rebuild ]]
          [[ "$BUILD_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          if [[ "$CREATE_RELEASE" == true && "$SIGN_APK" != true ]]; then
            echo "::error::Publishing requires the stable signing key"
            exit 1
          fi
          echo "tag=yimu-reference-v${BUILD_VERSION}-${GITHUB_RUN_NUMBER}" >> "$GITHUB_OUTPUT"
          python3 .github/scripts/reference_security.py
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad
        with:
          distribution: temurin
          java-version: "17"
      - name: Prepare official build tools on cloud runner
        shell: bash
        run: |
          set -euo pipefail
          sdkmanager "platforms;android-36" "build-tools;36.0.0"
          curl --fail --location --retry 3 https://services.gradle.org/distributions/gradle-9.4.1-bin.zip -o "$RUNNER_TEMP/gradle.zip"
          echo "2ab2958f2a1e51120c326cad6f385153bb11ee93b3c216c5fccebfdfbb7ec6cb  $RUNNER_TEMP/gradle.zip" | sha256sum --check
          unzip -q "$RUNNER_TEMP/gradle.zip" -d "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/gradle-9.4.1/bin" >> "$GITHUB_PATH"
      - name: Prepare stable release signing
        if: inputs.sign_apk
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: python3 .github/scripts/reference_signing.py
      - name: Compile app and device tests, run unit tests and lint
        id: validation
        continue-on-error: true
        run: >-
          python3 .github/scripts/run_checked.py gradle -p android
          :app:assembleRelease :app:assembleDebug :app:assembleDebugAndroidTest
          :app:testDebugUnitTest :app:lintRelease --continue --no-daemon --console=plain
      - name: Require discovered tests and inspect packaged app
        id: packaged
        if: ${{ !cancelled() }}
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          python3 .github/scripts/reference_reports.py
          apk=build/app/outputs/apk/release/app-release.apk
          if [[ "$SIGN_APK" != true ]]; then apk=build/app/outputs/apk/release/app-release-unsigned.apk; fi
          "$ANDROID_HOME/cmdline-tools/latest/bin/apkanalyzer" manifest print "$apk" > "$RUNNER_TEMP/reference-manifest.xml"
          python3 .github/scripts/reference_security.py --manifest "$RUNNER_TEMP/reference-manifest.xml" --apk "$apk"
          mkdir -p dist
          if [[ "$SIGN_APK" == true ]]; then
            "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose "$apk"
            cp "$apk" "dist/yimu-reference-v${BUILD_VERSION}-${GITHUB_RUN_NUMBER}.apk"
          else
            cp "$apk" "dist/UNSIGNED-yimu-reference-v${BUILD_VERSION}-${GITHUB_RUN_NUMBER}.apk"
          fi
      - name: Remove signing material
        if: always()
        run: rm -f android/key.properties android/app/offline-release.keystore
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: reference-validation-${{ github.run_number }}
          path: |
            build/app/reports/
            build/app/test-results/
            ${{ runner.temp }}/validation-logs/
          if-no-files-found: warn
          retention-days: 14
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: ${{ steps.validation.outcome == 'success' && steps.packaged.outcome == 'success' }}
        with:
          name: yimu-reference-${{ github.run_number }}
          path: dist/*.apk
          if-no-files-found: error
          retention-days: 14
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: ${{ steps.validation.outcome == 'success' }}
        with:
          name: reference-device-test-apks-${{ github.run_number }}
          path: |
            build/app/outputs/apk/debug/*.apk
            build/app/outputs/apk/androidTest/debug/*.apk
          if-no-files-found: error
          retention-days: 14
      - name: Require all checks to pass
        if: ${{ always() && !cancelled() }}
        env:
          VALIDATION: ${{ steps.validation.outcome }}
          PACKAGED: ${{ steps.packaged.outcome }}
        run: |
          python3 - <<'PY'
          import os
          assert os.environ['VALIDATION'] == 'success', 'Compile, unit test or lint failed'
          assert os.environ['PACKAGED'] == 'success', 'Packaged APK/security/signature verification failed'
          PY
  publish:
    needs: android
    if: ${{ inputs.create_release }}
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: yimu-reference-${{ github.run_number }}
          path: dist
      - name: Publish experimental prerelease
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ needs.android.outputs.tag }}
          COMMIT: ${{ github.sha }}
        run: gh release create "$TAG" dist/*.apk --target "$COMMIT" --prerelease --title "$TAG" --notes "Android 本地采集对比实验。跳过云同步、广告、会员及联网 SDK。"
