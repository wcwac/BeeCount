name: Offline Android

# User-authorized capture CI; all other branches remain manual-only.
on:
  push:
    branches: [feat/local-transaction-capture]
  workflow_dispatch:
    inputs:
      version:
        description: "版本号，例如 0.1.0"
        type: string
        default: "0.1.0"
        required: true
      sign_apk:
        description: "使用仓库 Secrets 中的固定密钥签名（安装需要签名）"
        type: boolean
        default: false
      create_release:
        description: "发布 GitHub 预发行版（必须同时开启签名）"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: offline-android-${{ github.ref }}
  cancel-in-progress: ${{ github.ref == 'refs/heads/feat/local-transaction-capture' }}

env:
  FLUTTER_VERSION: "3.27.3"

jobs:
  android:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    outputs:
      tag: ${{ steps.metadata.outputs.tag }}
    env:
      BUILD_VERSION: ${{ inputs.version || '0.3.0' }}
      SIGN_APK: ${{ inputs.sign_apk || false }}
      CREATE_RELEASE: ${{ inputs.create_release || false }}
    steps:
      - name: Validate inputs
        id: metadata
        shell: bash
        run: |
          set -euo pipefail
          [[ "$BUILD_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || {
            echo "::error::Version must have the form 0.1.0"
            exit 1
          }
          if [[ "$CREATE_RELEASE" == true && "$SIGN_APK" != true ]]; then
            echo "::error::Publishing requires a stable signing key; enable sign_apk."
            exit 1
          fi
          echo "tag=offline-v${BUILD_VERSION}-${GITHUB_RUN_NUMBER}" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Install Android SDK components
        shell: bash
        run: |
          set -euo pipefail
          python3 .github/scripts/run_checked.py "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            "platforms;android-36" "build-tools;36.0.0" "ndk;27.0.12077973"

      - name: Resolve dependencies
        run: python3 .github/scripts/run_checked.py flutter pub get

      - name: Save resolved dependency locks
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: dependency-locks-${{ github.run_number }}
          path: pubspec.lock
          retention-days: 14

      - name: Format financial feature sources
        run: >-
          dart format lib/models/finance.dart lib/data/finance_schema.dart
          lib/data/repositories/finance_repository.dart lib/providers/finance_providers.dart
          lib/pages/finance lib/services/backup test/finance
          lib/pages/auth/welcome_page.dart test/offline/welcome_flow_test.dart

      - name: Save normalized feature sources
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: finance-sources-${{ github.run_number }}
          path: |
            lib/models/finance.dart
            lib/data/finance_schema.dart
            lib/data/repositories/finance_repository.dart
            lib/providers/finance_providers.dart
            lib/pages/finance/
            lib/services/backup/
            lib/l10n/app_localizations*.dart
            test/finance/
            lib/pages/auth/welcome_page.dart
            test/offline/welcome_flow_test.dart
          retention-days: 14

      - name: Analyze source
        id: analyze
        continue-on-error: true
        run: python3 .github/scripts/run_checked.py flutter analyze --no-pub --no-fatal-infos --no-fatal-warnings

      - name: Test capture review and atomic commits
        id: capture_tests
        continue-on-error: true
        timeout-minutes: 5
        run: >-
          python3 .github/scripts/run_checked.py flutter test --no-pub
          test/capture test/widgets/amount_editor_currency_test.dart
          --reporter expanded --timeout 2m

      - name: Test local features and offline boundaries
        id: flutter_tests
        continue-on-error: true
        timeout-minutes: 10
        run: python3 .github/scripts/run_checked.py flutter test --no-pub --reporter expanded --timeout 2m

      - name: Configure stable signing key
        if: inputs.sign_apk
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          python3 - <<'PY'
          import base64
          import os
          from pathlib import Path

          names = (
              "ANDROID_KEYSTORE_BASE64", "ANDROID_KEYSTORE_PASSWORD",
              "ANDROID_KEY_ALIAS", "ANDROID_KEY_PASSWORD",
          )
          if any(not os.environ.get(name) for name in names):
              raise SystemExit("Configure all four Android signing Secrets first.")

          # Java Properties escaping preserves punctuation and Unicode passwords.
          def escaped(name):
              value = os.environ[name].encode("utf-16-be")
              return "".join("\\u%04x" % int.from_bytes(value[i:i+2], "big")
                             for i in range(0, len(value), 2))

          Path("android/app/offline-release.keystore").write_bytes(
              base64.b64decode(os.environ["ANDROID_KEYSTORE_BASE64"], validate=True))
          Path("android/key.properties").write_text(
              "storeFile=offline-release.keystore\n"
              f"storePassword={escaped('ANDROID_KEYSTORE_PASSWORD')}\n"
              f"keyAlias={escaped('ANDROID_KEY_ALIAS')}\n"
              f"keyPassword={escaped('ANDROID_KEY_PASSWORD')}\n")
          PY

      - name: Build APKs
        id: apk_build
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          python3 .github/scripts/run_checked.py flutter build apk --release --flavor prod --no-pub \
            --build-name="$BUILD_VERSION" --build-number="$GITHUB_RUN_NUMBER" \
            --dart-define="CI_VERSION=$BUILD_VERSION" \
            --dart-define="GIT_COMMIT=$GITHUB_SHA"

      # Flutter's APK build above prepares the Gradle wrapper/local.properties.
      # flutter test alone does not execute Kotlin capture rules and sessions.
      - name: Test Android capture rules and sessions
        id: native_unit
        continue-on-error: true
        working-directory: android
        shell: bash
        run: >-
          python3 ../.github/scripts/run_checked.py ./gradlew
          :app:testDevDebugUnitTest --continue --no-daemon --console=plain

      - name: Compile Android instrumentation tests
        id: instrumentation_build
        continue-on-error: true
        working-directory: android
        shell: bash
        run: >-
          python3 ../.github/scripts/run_checked.py ./gradlew
          :app:assembleDevDebugAndroidTest --continue --no-daemon --console=plain

      - name: Summarize Android unit tests
        id: native_summary
        continue-on-error: true
        if: always()
        env:
          UNIT_OUTCOME: ${{ steps.native_unit.outcome }}
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import os
          import xml.etree.ElementTree as ET
          def escape(value):
              return value.replace('%', '%25').replace('\r', '%0D').replace('\n', '%0A')
          totals = dict(tests=0, failures=0, errors=0, skipped=0)
          reports = list(Path('build/app/test-results/testDevDebugUnitTest').glob('TEST-*.xml'))
          for report in reports:
              root = ET.parse(report).getroot()
              for key in totals:
                  totals[key] += int(root.get(key, '0'))
              for case in root.iter('testcase'):
                  for failure in list(case.findall('failure')) + list(case.findall('error')):
                      message = f"{case.get('classname')}.{case.get('name')}\n{failure.text or failure.get('message', '')}"
                      print(f'::error title=Android unit test failed::{escape(message[:6000])}')
          if reports:
              print(f'::notice title=Android unit test totals::{totals}')
          if os.environ['UNIT_OUTCOME'] == 'success' and totals['tests'] == 0:
              raise SystemExit('Android unit task succeeded without a test report or discovered tests')
          PY

      - name: Save Android unit test reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: android-unit-tests-${{ github.run_number }}
          path: |
            build/app/test-results/testDevDebugUnitTest/
            build/app/reports/tests/testDevDebugUnitTest/
          if-no-files-found: warn
          retention-days: 14

      - name: Save full validation logs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: validation-logs-${{ github.run_number }}
          path: ${{ runner.temp }}/validation-logs/
          if-no-files-found: warn
          retention-days: 14

      - name: Verify APK permissions and signatures
        id: verify_apks
        if: ${{ !cancelled() && steps.apk_build.outcome == 'success' }}
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          apks=(build/app/outputs/apk/prod/release/*.apk)
          (( ${#apks[@]} > 0 )) || { echo "::error::No APKs found"; exit 1; }
          mkdir -p dist
          for apk in "${apks[@]}"; do
            permissions=$("$ANDROID_HOME/build-tools/36.0.0/aapt2" dump permissions "$apk")
            if grep -Eq 'android\.permission\.(INTERNET|ACCESS_NETWORK_STATE|RECORD_AUDIO|REQUEST_INSTALL_PACKAGES)' <<< "$permissions"; then
              echo "::error::Forbidden permission in $apk"
              exit 1
            fi
            manifest=$("$ANDROID_HOME/cmdline-tools/latest/bin/apkanalyzer" manifest print "$apk")
            manifest_path="$RUNNER_TEMP/offline-manifest.xml"
            printf '%s\n' "$manifest" > "$manifest_path"
            python3 - "$manifest_path" <<'PY'
          import sys
          import xml.etree.ElementTree as ET
          root = ET.parse(sys.argv[1]).getroot()
          assert root.attrib["package"] == "io.github.wcwac.beecount.offline"
          app = root.find("application")
          assert app is not None
          assert app.attrib.get("{http://schemas.android.com/apk/res/android}allowBackup") == "false"
          PY
            if [[ "$SIGN_APK" == true ]]; then
              "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose "$apk"
              cp "$apk" "dist/$(basename "$apk")"
            else
              cp "$apk" "dist/UNSIGNED-$(basename "$apk")"
            fi
          done
          cp pubspec.lock dist/pubspec.lock
          cp LICENSE LICENSE_EN THIRD-PARTY-NOTICES.md dist/
          printf 'Commit: %s\nVersion: %s\nBuild: %s\nSigned: %s\n' \
            "$GITHUB_SHA" "$BUILD_VERSION" "$GITHUB_RUN_NUMBER" "$SIGN_APK" > dist/BUILD.txt
          (cd dist && sha256sum -- *.apk pubspec.lock LICENSE LICENSE_EN THIRD-PARTY-NOTICES.md BUILD.txt > SHA256SUMS)

      - name: Remove signing material
        if: always()
        shell: bash
        run: rm -f android/key.properties android/app/offline-release.keystore

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: ${{ !cancelled() && steps.verify_apks.outcome == 'success' }}
        with:
          name: offline-android-${{ github.run_number }}
          path: dist/
          if-no-files-found: error
          retention-days: 14

      # Each check reports its own outcome; none of the required checks can be
      # hidden by continue-on-error. Publishing still requires the whole job.
      - name: Require every validation check to pass
        if: always() && !cancelled()
        env:
          ANALYZE: ${{ steps.analyze.outcome }}
          CAPTURE_TESTS: ${{ steps.capture_tests.outcome }}
          FLUTTER_TESTS: ${{ steps.flutter_tests.outcome }}
          APK_BUILD: ${{ steps.apk_build.outcome }}
          NATIVE_UNIT: ${{ steps.native_unit.outcome }}
          INSTRUMENTATION_BUILD: ${{ steps.instrumentation_build.outcome }}
          NATIVE_SUMMARY: ${{ steps.native_summary.outcome }}
          VERIFY_APKS: ${{ steps.verify_apks.outcome }}
        shell: bash
        run: |
          python3 - <<'PY'
          import os
          checks = ['ANALYZE', 'CAPTURE_TESTS', 'FLUTTER_TESTS', 'APK_BUILD',
                    'NATIVE_UNIT', 'INSTRUMENTATION_BUILD', 'NATIVE_SUMMARY', 'VERIFY_APKS']
          failures = []
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as summary:
              summary.write('| Check | Outcome |\n| --- | --- |\n')
              for check in checks:
                  outcome = os.environ.get(check) or 'not run'
                  summary.write(f'| {check} | {outcome} |\n')
                  if outcome != 'success':
                      failures.append(check)
                      print(f'::error::{check}: {outcome}')
          if failures:
              raise SystemExit(f"Required checks failed: {', '.join(failures)}")
          print('::notice::All required validation checks passed')
          PY

  release:
    if: inputs.create_release
    needs: android
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: offline-android-${{ github.run_number }}
          path: dist

      - name: Publish signed APKs as a prerelease
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ needs.android.outputs.tag }}
        shell: bash
        run: |
          set -euo pipefail
          cat > "$RUNNER_TEMP/release-notes.md" <<'EOF'
          BeeCount 离线修改版，基于 sunxiao / TNT-Likely 的 BeeCount。
          云同步、AI 上传、在线更新和外部链接已禁用。

          使用独立 Android 包名，不会覆盖原版；迁移数据请使用本地导出/导入。
          此预发行版通过 CI 检查，不代表已完成真机功能和网络抓包验证。
          APK、依赖锁定文件及 SHA-256 校验值见附件。版权与许可见仓库和附件。
          EOF
          gh release create "$RELEASE_TAG" dist/* \
            --repo "$GH_REPO" --target "$GITHUB_SHA" \
            --title "BeeCount Offline $RELEASE_TAG" \
            --notes-file "$RUNNER_TEMP/release-notes.md" \
            --prerelease --latest=false
