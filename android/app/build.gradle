plugins { id "com.android.application" }

def signing = new Properties()
def signingFile = rootProject.file('key.properties')
if (signingFile.exists()) signingFile.withInputStream { signing.load(it) }

android {
    namespace 'com.wangc.bill'
    compileSdk 36
    defaultConfig {
        applicationId 'io.github.wcwac.yimu.reference'
        minSdk 24
        targetSdk 36
        versionCode = Integer.parseInt(System.getenv('BUILD_NUMBER') ?: '1')
        versionName = System.getenv('BUILD_VERSION') ?: '0.1.0'
        testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
    }
    sourceSets {
        main { java.srcDirs = ['src/yimu/java']; res.srcDirs = ['src/yimu/res']; manifest.srcFile 'src/yimu/AndroidManifest.xml'; assets.srcDirs = []; jniLibs.srcDirs = [] }
        test { java.srcDirs = ['src/yimuUnit/java'] }
        androidTest { java.srcDirs = ['src/yimuTest/java']; manifest.srcFile 'src/yimuTest/AndroidManifest.xml'; res.srcDirs = []; assets.srcDirs = [] }
    }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
    buildFeatures { buildConfig true }
    signingConfigs {
        release {
            if (signing['storeFile']) {
                storeFile file(signing['storeFile']); storePassword signing['storePassword']
                keyAlias signing['keyAlias']; keyPassword signing['keyPassword']
            }
        }
    }
    buildTypes {
        debug { applicationIdSuffix ".debug"; versionNameSuffix "-debug" }
        release {
            if (signing['storeFile']) signingConfig signingConfigs.release
            minifyEnabled false
            shrinkResources false
        }
    }
    lint { abortOnError true; checkReleaseBuilds true; disable 'MissingTranslation', 'ExtraTranslation', 'TypographyFractions', 'TypographyQuotes', 'ObsoleteSdkInt', 'UnusedResources' }
    packaging { resources.excludes += ['META-INF/DEPENDENCIES', 'META-INF/LICENSE*', 'META-INF/NOTICE*'] }
}
dependencies {
    implementation platform('org.jetbrains.kotlin:kotlin-bom:1.8.22')
    implementation 'androidx.appcompat:appcompat:1.7.1'
    implementation 'androidx.recyclerview:recyclerview:1.4.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.2.1'
    implementation 'androidx.cardview:cardview:1.0.0'
    implementation 'androidx.drawerlayout:drawerlayout:1.2.0'
    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test:runner:1.6.2'
    androidTestImplementation 'androidx.test.ext:junit:1.2.1'
    androidTestImplementation 'androidx.test:core:1.6.1'
    androidTestImplementation 'androidx.test.uiautomator:uiautomator:2.3.0'
}
tasks.withType(JavaCompile).configureEach { options.compilerArgs += ['-Xmaxerrs', '1000', '-Xlint:unchecked'] }
