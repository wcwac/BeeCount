plugins { id 'com.android.application'; id 'org.jetbrains.kotlin.android'; id 'org.jetbrains.kotlin.plugin.compose' }

def signing = new Properties()
def signingFile = rootProject.file('key.properties')
if (signingFile.exists()) signingFile.withInputStream { signing.load(it) }

android {
    namespace 'io.github.wcwac.beecount.nativeapp'
    compileSdk 36
    defaultConfig {
        applicationId 'io.github.wcwac.beecount.nativeapp'
        minSdk 26
        targetSdk 36
        versionCode = Integer.parseInt(System.getenv('BUILD_NUMBER') ?: '1')
        versionName = System.getenv('BUILD_VERSION') ?: '0.1.0'
        testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
    }
    sourceSets {
        main { java.srcDirs = ['src/native/kotlin']; res.srcDirs = ['src/native/res']; manifest.srcFile 'src/native/AndroidManifest.xml'; assets.srcDirs = []; jniLibs.srcDirs = [] }
        test { java.srcDirs = ['src/nativeUnit/kotlin'] }
        androidTest { java.srcDirs = ['src/nativeTest/kotlin']; manifest.srcFile 'src/nativeTest/AndroidManifest.xml'; res.srcDirs = []; assets.srcDirs = [] }
    }
    buildFeatures { compose true; buildConfig true }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
    signingConfigs {
        release {
            if (signing['storeFile']) {
                storeFile file(signing['storeFile']); storePassword signing['storePassword']
                keyAlias signing['keyAlias']; keyPassword signing['keyPassword']
            }
        }
    }
    buildTypes {
        debug { applicationIdSuffix '.debug'; versionNameSuffix '-debug' }
        release {
            if (signing['storeFile']) signingConfig signingConfigs.release
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'native-proguard-rules.pro'
        }
    }
    lint { abortOnError true; checkReleaseBuilds true }
    packaging { resources.excludes += ['META-INF/DEPENDENCIES', 'META-INF/LICENSE*', 'META-INF/NOTICE*'] }
}
kotlin { jvmToolchain(17) }
dependencies {
    implementation project(':domain')
    implementation project(':data')
    implementation project(':capture')
    implementation project(':ui')
    implementation platform(libs.compose.bom)
    implementation libs.compose.ui
    implementation libs.compose.material3
    implementation libs.activity.compose
    implementation libs.lifecycle.runtime.compose
    implementation libs.lifecycle.viewmodel.compose
    implementation libs.coroutines.android
    implementation libs.datastore
    implementation libs.work
    implementation 'androidx.core:core-ktx:1.16.0'
    implementation 'androidx.documentfile:documentfile:1.1.0'
    implementation libs.room.runtime
    implementation libs.room.ktx
    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test:runner:1.6.2'
    androidTestImplementation 'androidx.test.ext:junit:1.2.1'
    androidTestImplementation 'androidx.test:core:1.6.1'
    androidTestImplementation 'androidx.test.uiautomator:uiautomator:2.3.0'
}
