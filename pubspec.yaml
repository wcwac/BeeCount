name: beecount
description: "A new Flutter project."
publish_to: 'none'
version: 0.0.1

environment:
  sdk: ^3.13.5
  flutter: ">=3.47.7"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: ^3.4.3
  collection: ^1.19.1
  drift: ^2.35.2
  path_provider: ^2.1.6
  path: ^1.9.1
  intl: ^0.20.3
  decimal: ^3.2.6
  fl_chart: ^1.3.0
  shared_preferences: ^2.5.6
  csv: ^8.0.0
  file_picker: ^13.1.0
  crypto: ^3.0.7
  uuid: ^4.6.0
  flutter_svg: ^2.3.0
  flutter_markdown_plus: ^1.0.12
  package_info_plus: ^10.2.2
  share_plus: ^13.3.1
  flutter_local_notifications: ^22.3.2
  timezone: ^0.11.2
  flutter_list_view: ^1.1.29
  visibility_detector: ^0.4.0+2
  reorderable_grid_view: ^2.2.8
  excel: ^4.0.6
  home_widget: ^0.10.0
  image_picker: ^1.2.4
  flutter_image_compress: ^2.5.1
  image_cropper: ^13.0.0
  gbk_codec: ^0.4.0
  app_links: ^7.2.2
  yaml: ^3.1.4
  qr_flutter: ^4.1.0
  gal: ^2.3.3
  # excel 4.x still requires archive 3.x; keep a compatible shared graph.
  archive: ^3.6.1
  table_calendar: ^3.3.0
  local_auth: ^3.0.2
  country_flags: ^4.1.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  # 2.17.1 requires build 5; current drift_dev requires build <5.
  build_runner: 2.17.0
  drift_dev: ^2.35.1
  flutter_launcher_icons: ^0.14.4
  # Testing framework enhancements
  mocktail: ^1.0.5

# adaptive_* 三个素材由 scripts/gen_adaptive_icons.py 生成(几何取自 assets/logo.svg);
# monochrome 是 Android 13+ themed icon(Pixel 动态图标)的单色镂空层,见 issue #186。
flutter_launcher_icons:
  android: true
  ios: false  # iOS 图标手工维护,0.14.x 会重写 Contents.json 格式,不要让它碰
  # ⚠️ legacy mipmap ic_launcher.png 已钉死为线上版本(担心影响存量用户),
  # 重跑本工具后务必恢复:git checkout main -- android/app/src/main/res/mipmap-*/ic_launcher.png
  image_path: assets/icon/launcher_legacy.png  # 不透明白底!透明 legacy 图标在部分设备表现差
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: assets/icon/adaptive_foreground.png
  adaptive_icon_monochrome: assets/icon/adaptive_monochrome.png

flutter:
  uses-material-design: true
  generate: true
  assets:
    - PRIVACY.md
    - docs/OFFLINE_HELP.md
    - docs/OFFLINE_HELP_EN.md
    - LICENSE
    - LICENSE_EN
    - THIRD-PARTY-NOTICES.md
    - assets/logo.svg
    - assets/bee.svg
    - assets/logo2.png
    - assets/icons/
    - assets/icons/social/
    - assets/images/
  # 字体已移动到可选依赖，使用系统字体以减少应用体积
  # fonts:
  #   - family: Inter
  #     fonts:
  #       - asset: assets/fonts/Inter-Regular.ttf
  #       - asset: assets/fonts/Inter-Medium.ttf
  #         weight: 500
  #       - asset: assets/fonts/Inter-SemiBold.ttf
  #         weight: 600
  #       - asset: assets/fonts/Inter-Bold.ttf
  #         weight: 700
  #   - family: NotoSansSC
  #     fonts:
  #       - asset: assets/fonts/NotoSansSC-Regular.ttf
  #       - asset: assets/fonts/NotoSansSC-Medium.ttf
  #         weight: 500
  #       - asset: assets/fonts/NotoSansSC-SemiBold.ttf
  #         weight: 600
  #       - asset: assets/fonts/NotoSansSC-Bold.ttf
  #         weight: 700
